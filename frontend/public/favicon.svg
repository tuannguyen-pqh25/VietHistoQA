  <polygon points="51,32 41,29.5 43,32 41,34.5" fill="#E6BE8A" />
  
  <polygon points="18.5,18.5 28,24 25.5,25.5 24,28" fill="#E6BE8A" />
  <polygon points="45.5,45.5 36,40 38.5,38.5 40,36" fill="#E6BE8A" />
